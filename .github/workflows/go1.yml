name: build & test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic

      # 注意：本 job 不带 liveintegration 标签，故 dbmysql/dbmongo 的 IsHealthy、
      # PingTry 等仅 live 可达的函数在此恒为 0.0%，属构建标签造成的度量假象。
      # 含 live 路径的合并覆盖率由 smoke job 的「Report coverage including live paths」给出。
      - name: Report hermetic coverage
        run: |
          go tool cover -func=coverage.out | tee coverage-summary.txt
          grep '^total:' coverage-summary.txt

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test with race detector
        run: go test -race ./... -count=1

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_NAME: fhweb
      LDFLAGS: -ldflags="-X 'main.Version=v0.0.1'"
      APP_ENV_application_env: test
      APP_ENV_application_appType: web
    services:
      redis:
        image: redis:8.2.7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8.0.26-noble
        ports:
          - 27037:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4.10-oraclelinux9
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build example
        run: go build ${{ env.LDFLAGS }} -o "$RUNNER_TEMP/${{ env.TARGET_NAME }}" ./example_main/main.go

      - name: Start example
        run: |
          "$RUNNER_TEMP/${{ env.TARGET_NAME }}" >"$RUNNER_TEMP/${{ env.TARGET_NAME }}.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/${{ env.TARGET_NAME }}.pid"

      - name: Check HTTP path
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/health/livez

      # 二进制响应协商的冒烟断言：feature-status.md 对 MsgPack / Protobuf 的
      # 晋级条件 5（文档示例确实执行该路径）由 GET /examples/binary 闭合。
      # 只断言 Content-Type 不够——曾出现过 Content-Type 正确但 data 被静默丢弃
      # 的情况（structpb.NewValue 不接受自定义 struct，RespInfoPB.Reset 吞掉错误），
      # 故同时断言 body 可解码且 data 内容完整。
      - name: Check binary response negotiation
        run: |
          set -euo pipefail

          # MsgPack：Content-Type 必须回显，body 必须能解出 code/msg/data。
          mp_ct="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/msgpack' \
            -o "$RUNNER_TEMP/binary.msgpack" \
            -w '%{content_type}' \
            'http://127.0.0.1:8080/examples/binary?echo=mp')"
          if [[ "$mp_ct" != "application/msgpack" ]]; then
            echo "msgpack: unexpected Content-Type: $mp_ct" >&2
            exit 1
          fi

          # Protobuf：同上，且 body 必须远大于仅含 msg 的退化情形。
          pb_ct="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/x-protobuf' \
            -o "$RUNNER_TEMP/binary.pb" \
            -w '%{content_type}' \
            'http://127.0.0.1:8080/examples/binary?echo=pb')"
          if [[ "$pb_ct" != "application/x-protobuf" ]]; then
            echo "protobuf: unexpected Content-Type: $pb_ct" >&2
            exit 1
          fi

          # 未指定协商标头时必须回退 JSON，且不得返回 406。
          json_ct="$(curl --fail --silent --show-error \
            -o "$RUNNER_TEMP/binary.json" \
            -w '%{content_type}' \
            'http://127.0.0.1:8080/examples/binary?echo=plain')"
          case "$json_ct" in
            application/json*) ;;
            *) echo "fallback: unexpected Content-Type: $json_ct" >&2; exit 1 ;;
          esac

          # 逐个解码，断言 data 完整（而非 Content-Type 对但 payload 为空）。
          go run ./.github/scripts/verify_binary_response.go \
            --msgpack "$RUNNER_TEMP/binary.msgpack" \
            --protobuf "$RUNNER_TEMP/binary.pb" \
            --json "$RUNNER_TEMP/binary.json"

      - name: Run live integration tests
        timeout-minutes: 2
        run: go test -tags=liveintegration ./... -run 'TestLive_' -v -count=1 -coverprofile=coverage-live.out -covermode=atomic

      - name: Report coverage including live paths
        run: |
          # 合并 hermetic 与 live 两份 profile：仅 live-tag 可达的函数（dbmysql/dbmongo
          # 的 IsHealthy、PingTry 等）在 hermetic profile 中恒为 0.0%，只看那一份会把
          # 构建标签造成的度量假象当成真实未覆盖。
          # atomic 模式的 profile 可直接拼接：保留一行 mode 头，其余行原样追加；
          # go tool cover 会对同一代码块的多次计数求和（已实测：同一代码块 count 0 与
          # count 7 拼接后判定为 100.0%，非首条覆盖）。仓库未引入 gocovmerge 等外部工具。
          # 这里需要再跑一次 hermetic：上一步带 -run 'TestLive_' 只执行 live 用例，
          # 其 profile 不含普通用例的计数，故两份必须都有。代价是 quality job 的测试
          # 在本 job 重跑一次。
          go test ./... -count=1 -coverprofile=coverage-hermetic.out -covermode=atomic
          head -n 1 coverage-hermetic.out > coverage.out
          tail -n +2 coverage-hermetic.out >> coverage.out
          tail -n +2 coverage-live.out >> coverage.out
          go tool cover -func=coverage.out | tee coverage-summary.txt
          grep '^total:' coverage-summary.txt

      - name: Print example log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/${{ env.TARGET_NAME }}.log"

      - name: Stop example
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/${{ env.TARGET_NAME }}.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/${{ env.TARGET_NAME }}.pid")" || true
          fi
