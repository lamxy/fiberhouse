name: Mirror to Gitee

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:
  #schedule:
    # 每天 03:30 UTC 兜底同步一次
    # - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # 从 Variables 读取 Gitee 目标命名空间与仓库名
      GITEE_OWNER: ${{ vars.GITEE_OWNER }}
      GITEE_REPO:  ${{ vars.GITEE_REPO }}
      # 从 Secrets 读取用户名与 PAT
      GITEE_USER:  ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      # 如需同步 LFS，把它改为 true（前提：Gitee 仓库支持 LFS）
      PUSH_LFS: "false"
    steps:
      - name: Validate config
        run: |
          set -e
          if [ -z "$GITEE_OWNER" ] || [ -z "$GITEE_REPO" ]; then
            echo "Missing variables: GITEE_OWNER or GITEE_REPO (set them in Settings -> Secrets and variables -> Actions -> Variables)" >&2
            exit 1
          fi
          if [ -z "$GITEE_USER" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "Missing secrets: GITEE_USER or GITEE_TOKEN (set them in Settings -> Secrets and variables -> Actions -> Secrets)" >&2
            exit 1
          fi

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add Gitee remote (HTTPS + Token)
        run: |
          set -e
          # GitHub 会自动遮罩 Secret，不会把 Token 打到日志里
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git remote -v

      - name: Fetch all refs
        run: |
          set -e
          # --force 不可省略: tag 事件下 actions/checkout 已带入被推送的 tag，
          # 再次 fetch 会以 "would clobber existing tag" 失败。
          git fetch origin --force --prune --prune-tags --tags "+refs/heads/*:refs/remotes/origin/*"
          # origin/HEAD 是符号引用，按 refspec 展开会得到无效的分支名 HEAD
          git remote set-head origin --delete || true

      - name: Mirror branches and tags
        run: |
          set -e
          # 只推送分支与标签。不能用 --mirror: 它会连 refs/remotes/* 一起推，
          # 而 Gitee 把这些视为 hidden ref 直接拒绝，导致即便分支已同步成功，
          # 整个 push 仍以非零退出码失败。
          git push --force --prune gitee "refs/remotes/origin/*:refs/heads/*"
          git push --force --prune gitee "refs/tags/*:refs/tags/*"

      - name: (Optional) Push Git LFS objects
        if: env.PUSH_LFS == 'true'
        run: |
          set -e
          git lfs install
          # 把所有 LFS 对象推到 Gitee
          git lfs fetch --all
          git lfs push gitee --all