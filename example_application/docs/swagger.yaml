basePath: /
consumes:
- application/json
definitions:
  requestvo.CreateExampleReqVo:
    properties:
      description:
        description: |-
          自由文本描述，最多 500 个字符。
          example: A short description of the example.
        maxLength: 500
        type: string
      name:
        description: |-
          example 的展示名称。必填，2-80 个字符。
          example: My Example
        maxLength: 80
        minLength: 2
        type: string
      status:
        description: |-
          生命周期状态；取 active/archived 之一。默认值在 service 层应用。
          example: active
        enum:
        - active
        - archived
        type: string
      tags:
        description: |-
          最多 10 个自由标签，每个 1-30 个字符。
          example: ["demo","swagger"]
        items:
          type: string
        maxItems: 10
        type: array
    required:
    - name
    type: object
  requestvo.UpdateExampleReqVo:
    properties:
      description:
        description: |-
          新的描述，最多 500 个字符。省略则保持不变。
          example: Updated description.
        maxLength: 500
        type: string
      name:
        description: |-
          新的展示名称，2-80 个字符。省略则保持不变。
          example: My Renamed Example
        maxLength: 80
        minLength: 2
        type: string
      status:
        description: |-
          新的状态；取 active/archived 之一。省略则保持不变。
          example: archived
        enum:
        - active
        - archived
        type: string
      tags:
        description: |-
          新的标签集合，最多 10 个、每个 1-30 个字符。省略则保持不变。
          example: ["demo"]
        items:
          type: string
        maxItems: 10
        type: array
    type: object
  response.RespInfo:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  responsevo.ExampleListRespVo:
    properties:
      items:
        description: 本页的 example 列表。
        items:
          $ref: '#/definitions/responsevo.ExampleRespVo'
        type: array
      page:
        description: |-
          实际返回的页码。
          example: 1
        type: integer
      page_size:
        description: |-
          实际返回的每页数量。
          example: 20
        type: integer
      total:
        description: |-
          满足过滤条件的 example 总数（跨所有页）。
          example: 42
        type: integer
    type: object
  responsevo.ExampleRespVo:
    properties:
      created_at:
        type: string
      description:
        description: |-
          自由文本描述。
          example: A short description of the example.
        type: string
      id:
        description: |-
          example 的唯一标识。
          example: 01f8h6z8k9q2p3r4s5t6u7v8w9
        type: string
      name:
        description: |-
          example 的展示名称。
          example: My Example
        type: string
      status:
        description: |-
          生命周期状态；取 active/archived 之一。
          example: active
        type: string
      tags:
        description: |-
          与该 example 关联的自由标签。
          example: ["demo","swagger"]
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  license:
    name: XXX copyright
  title: XXX Service APIs
  version: "1.0"
paths:
  /examples:
    get:
      consumes:
      - application/json
      description: 分页查询 example 资源，可按 status 过滤。
      operationId: fiberListExamples
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量，最大 100（默认 20）
        in: query
        name: page_size
        type: integer
      - description: 按状态过滤
        enum:
        - active
        - archived
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.RespInfo'
            - properties:
                data:
                  $ref: '#/definitions/responsevo.ExampleListRespVo'
              type: object
        "400":
          description: 查询参数非法
          schema:
            $ref: '#/definitions/response.RespInfo'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/response.RespInfo'
      summary: 查询 example 列表
      tags:
      - example
    post:
      consumes:
      - application/json
      description: 使用 name、description、status 和 tags 创建一个新的 example 资源。
      operationId: fiberCreateExample
      parameters:
      - description: 待创建的 example
        in: body
        name: example
        required: true
        schema:
          $ref: '#/definitions/requestvo.CreateExampleReqVo'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.RespInfo'
            - properties:
                data:
                  $ref: '#/definitions/responsevo.ExampleRespVo'
              type: object
        "400":
          description: 输入非法 / 校验错误
          schema:
            $ref: '#/definitions/response.RespInfo'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/response.RespInfo'
      summary: 创建 example
      tags:
      - example
  /examples/{id}:
    delete:
      consumes:
      - application/json
      description: 按 id 删除 example 资源。
      operationId: fiberDeleteExample
      parameters:
      - description: example id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
        "400":
          description: id 非法
          schema:
            $ref: '#/definitions/response.RespInfo'
        "404":
          description: example 不存在
          schema:
            $ref: '#/definitions/response.RespInfo'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/response.RespInfo'
      summary: 删除 example
      tags:
      - example
    get:
      consumes:
      - application/json
      description: 按 id 获取单个 example 资源。
      operationId: fiberGetExample
      parameters:
      - description: example id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.RespInfo'
            - properties:
                data:
                  $ref: '#/definitions/responsevo.ExampleRespVo'
              type: object
        "400":
          description: id 非法
          schema:
            $ref: '#/definitions/response.RespInfo'
        "404":
          description: example 不存在
          schema:
            $ref: '#/definitions/response.RespInfo'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/response.RespInfo'
      summary: 获取 example
      tags:
      - example
    put:
      consumes:
      - application/json
      description: 按 id 部分更新 example 资源，仅更新请求体中出现的字段。
      operationId: fiberUpdateExample
      parameters:
      - description: example id
        in: path
        name: id
        required: true
        type: string
      - description: 待更新的字段
        in: body
        name: example
        required: true
        schema:
          $ref: '#/definitions/requestvo.UpdateExampleReqVo'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.RespInfo'
            - properties:
                data:
                  $ref: '#/definitions/responsevo.ExampleRespVo'
              type: object
        "400":
          description: 输入非法 / 校验错误
          schema:
            $ref: '#/definitions/response.RespInfo'
        "404":
          description: example 不存在
          schema:
            $ref: '#/definitions/response.RespInfo'
        "409":
          description: 更新冲突或内容未变化
          schema:
            $ref: '#/definitions/response.RespInfo'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/response.RespInfo'
      summary: 更新 example
      tags:
      - example
  /examples/cache/{id}:
    get:
      description: 按 id 读取 example，并演示二级缓存、完整路径单飞、TTL 抖动和请求上下文传播。
      operationId: fiberGetExampleWithCache
      parameters:
      - description: example id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.RespInfo'
            - properties:
                data:
                  $ref: '#/definitions/responsevo.ExampleRespVo'
              type: object
        "400":
          description: id 非法
          schema:
            $ref: '#/definitions/response.RespInfo'
        "404":
          description: example 不存在
          schema:
            $ref: '#/definitions/response.RespInfo'
        "500":
          description: 缓存或内部错误
          schema:
            $ref: '#/definitions/response.RespInfo'
      summary: 缓存组件使用样例
      tags:
      - example
produces:
- application/json
schemes:
- http
- https
swagger: "2.0"
